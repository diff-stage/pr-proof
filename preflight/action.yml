name: Diff Stage preflight
description: Check GitHub App access and read which browser tests to record for this pull request. Run in a trusted job without checking out repository code.
inputs:
  url:
    description: Diff Stage service URL.
    default: https://diffstage.com
outputs:
  tests:
    description: Comma-separated test files named for this branch, empty when there is nothing to record.
    value: ${{ steps.preflight.outputs.tests }}
  selection:
    description: JSON selection for diff-stage-record and the publish action.
    value: ${{ steps.preflight.outputs.selection }}
runs:
  using: composite
  steps:
    - id: preflight
      shell: bash
      env:
        DIFF_STAGE_URL: ${{ inputs.url }}
      run: node "${{ github.action_path }}/preflight.cjs"

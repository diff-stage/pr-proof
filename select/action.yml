name: Diff Stage select
description: Choose files or exact scenarios explicitly requested in the PR description.

inputs:
  pattern:
    description: Regex for browser test files.
    default: '^tests/Browser/.+Test\.php$'
  token:
    description: Unused; kept for workflow compatibility.
    default: ${{ github.token }}

outputs:
  tests:
    description: Comma-separated test files, empty when there is nothing to record.
    value: ${{ steps.choose.outputs.tests }}

  selection:
    description: JSON selection for diff-stage-record.
    value: ${{ steps.choose.outputs.selection }}

runs:
  using: composite
  steps:
    - id: choose
      shell: bash
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PATTERN: ${{ inputs.pattern }}
      run: |
        node "${{ github.action_path }}/select.cjs"

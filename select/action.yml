name: pr-proof select
description: Choose which browser test files to record for this pull request.

inputs:
  pattern:
    description: Regex for browser test files.
    default: '^tests/Browser/.+Test\.php$'
  token:
    description: Token that can read the pull request.
    default: ${{ github.token }}

outputs:
  tests:
    description: Comma-separated test files, empty when there is nothing to record.
    value: ${{ steps.choose.outputs.tests }}

runs:
  using: composite
  steps:
    - id: choose
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PATTERN: ${{ inputs.pattern }}
      run: |
        changed=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only)
        requested=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^Browser videos: *//Ip' | tr ', ' '\n\n')
        tests=$(printf '%s\n%s\n' "$changed" "$requested" | grep -E "$PATTERN" | sort -u | paste -sd, - || true)
        echo "tests=$tests" >> "$GITHUB_OUTPUT"
        echo "Recording: ${tests:-nothing}"

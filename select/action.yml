name: pr-proof select
description: Choose only browser test files explicitly requested in the PR description.

inputs:
  pattern:
    description: Regex for browser test files.
    default: '^tests/Browser/.+Test\.php$'
  token:
    description: Unused; kept for workflow compatibility.
    default: ${{ github.token }}

outputs:
  tests:
    description: Comma-separated test files, empty when there is nothing to record.
    value: ${{ steps.choose.outputs.tests }}

runs:
  using: composite
  steps:
    - id: choose
      shell: bash
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PATTERN: ${{ inputs.pattern }}
      run: |
        requested=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^Browser videos: *//Ip' | tr ', ' '\n\n')
        tests=$(printf '%s\n' "$requested" | grep -E "$PATTERN" | sort -u | paste -sd, - || true)
        echo "tests=$tests" >> "$GITHUB_OUTPUT"
        if [[ -n "$tests" ]]; then
          echo "Recording requested browser tests: $tests"
        else
          echo "No matching Browser videos: files selected; skipping recording."
        fi

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Recorder compatibility</title></head>
<body>
<h1>Recorder compatibility</h1>
<label>Message <input name="message"></label>
<button onclick="document.querySelector('#result').textContent = document.querySelector('input').value">Save message</button>
<p id="result">No message saved</p>
</body>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Recorder compatibility</title></head>
<body>
<h1>Recorder compatibility</h1>
<label>Message <input name="message"></label>
<label><input name="terms" type="checkbox"> Accept terms</label>
<button onclick="document.querySelector('#result').textContent = document.querySelector('input').value; setTimeout(() => document.querySelector('#saved').textContent = 'Message saved', 900)">Save message</button>
<p id="result">No message saved</p>
<p id="saved"></p>
</body>
</html>

name: pr-proof publish
description: Upload recorded browser test videos to pr-proof and post them on the pull request.

inputs:
  mode:
    description: Run kind, pull_request or baseline.
    default: pull_request
  videos:
    description: Directory containing the recorded .webm files.
    default: tests/Browser/Videos
  api-token:
    description: Optional project token for repositories without a Diff Stage GitHub App connection. Otherwise uses GitHub Actions identity.
  url:
    description: pr-proof service URL.
    default: https://pr-proof-production-it8ufh.laravel.cloud
  token:
    description: Token that can comment on the pull request.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
        RECORDING_ID: ${{ github.run_id }}:${{ github.run_attempt }}
        RECORDING_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ inputs.token }}
        PR_PROOF_TOKEN: ${{ inputs.api-token }}
        PR_PROOF_URL: ${{ inputs.url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        VIDEOS: ${{ inputs.videos }}
        COMPRESS: ${{ github.action_path }}/../bin/pr-proof-compress
      run: bash "${{ github.action_path }}/publish.sh"

name: Diff Stage publish
description: Upload recorded browser test videos to Diff Stage and post them on the pull request.

inputs:
  mode:
    description: Run kind, pull_request or baseline.
    default: pull_request
  videos:
    description: Directory containing the recorded .webm files.
    default: tests/Browser/Videos
  api-token:
    description: Optional project token for self-hosted services that support it. Otherwise uses GitHub Actions identity.
  url:
    description: Diff Stage service URL.
    default: https://diffstage.com
  token:
    description: Token that can comment on the pull request.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
        RECORDING_ID: ${{ github.run_id }}:${{ github.run_attempt }}
        RECORDING_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ inputs.token }}
        DIFF_STAGE_TOKEN: ${{ inputs.api-token }}
        DIFF_STAGE_URL: ${{ inputs.url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        VIDEOS: ${{ inputs.videos }}
        COMPRESS: ${{ github.action_path }}/../bin/diff-stage-compress
      run: bash "${{ github.action_path }}/publish.sh"

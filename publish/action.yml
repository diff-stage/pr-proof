name: pr-proof publish
description: Upload recorded browser test videos to pr-proof and post them on the pull request.

inputs:
  videos:
    description: Directory containing the recorded .webm files.
    default: tests/Browser/Videos
  api-token:
    description: pr-proof project token.
    required: true
  url:
    description: pr-proof service URL.
    required: true
  token:
    description: Token that can comment on the pull request.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_PROOF_TOKEN: ${{ inputs.api-token }}
        PR_PROOF_URL: ${{ inputs.url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        VIDEOS: ${{ inputs.videos }}
        COMPRESS: ${{ github.action_path }}/../bin/pr-proof-compress
      run: |
        shopt -s nullglob
        videos=("$VIDEOS"/*.webm)
        if (( ${#videos[@]} == 0 )); then echo "No videos recorded"; exit 0; fi

        command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
        api() { curl -sSf -H "Authorization: Bearer $PR_PROOF_TOKEN" -H 'Accept: application/json' "$@"; }

        run=$(api -X POST "${PR_PROOF_URL%/}/api/runs" \
          -d "pull_request=$PR_NUMBER" -d "sha=$HEAD_SHA" --data-urlencode "branch=$HEAD_REF")
        run_id=$(jq -r .id <<< "$run")
        run_url=$(jq -r .url <<< "$run")

        cells=''
        for video in "${videos[@]}"; do
          name=$(basename "$video" .webm)
          mp4="${video%.webm}.mp4"
          poster="${video%.webm}.jpg"

          bash "$COMPRESS" "$video" "$mp4"
          ffmpeg -v error -y -sseof -0.5 -i "$mp4" -frames:v 1 -vf scale=640:-1 -q:v 4 "$poster"

          uploaded=$(api -X POST "${PR_PROOF_URL%/}/api/runs/$run_id/videos" \
            -F "name=$name" -F "video=@$mp4;type=video/mp4" -F "poster=@$poster;type=image/jpeg")
          cells+=$(printf '<a href="%s"><img src="%s" width="280" alt="%s"></a> ' \
            "$(jq -r .url <<< "$uploaded")" "$(jq -r .poster_url <<< "$uploaded")" "$name")
        done

        body=$(mktemp)
        {
          echo '<!-- pr-proof -->'
          echo "### Browser test videos for ${HEAD_SHA::7}"
          echo
          echo "**[Watch all ${#videos[@]} on pr-proof]($run_url)**"
          echo
          echo "$cells"
        } > "$body"

        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- pr-proof -->")) | .id' | tail -n 1)
        if [[ -n "$existing" ]]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$body" >/dev/null
        else
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
        fi
